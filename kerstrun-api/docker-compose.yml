services:
  kerstrun-api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPREADSHEET_ID: "1d3_Fa4MsWha5LlijVDB9v5NOqDsaU_0kK0moxnINH6Y"
      SHEET_GID: "1174835771"
      SUM_RANGE: "D2:D"
      REFRESH_SECONDS: "60"
      ALLOWED_ORIGINS: "https://ajokvzw.be,https://www.ajokvzw.be,http://localhost:4000,http://127.0.0.1:4000"
    volumes:
      # Service account key (never commit this file!)
      - ./secrets/service-account.json:/secrets/service-account.json:ro
      # Last successful value survives restarts
      - kerstrun-data:/data

volumes:
  kerstrun-data:
