title: Raad van Bestuur
text: >
  Onze vzw draait het hele jaar door dankzij de inzet van onze fantastische raad
  van bestuur! Deze groep gemotiveerde vrijwilligers speelt een cruciale rol in de
  groei en het succes van AJOK. Samen zorgen we ervoor dat onze missie en visie
  werkelijkheid worden.

  Heb jij een passie voor onze organisatie en wil je meehelpen om AJOK naar een
  hoger niveau te tillen? Stuur een e-mail naar info@ajok.be en sluit je aan bij onze
  raad van bestuur!
