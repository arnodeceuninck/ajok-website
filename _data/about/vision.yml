title: Onze Visie
text: >
  AJOK zet zich in om kinderen en jongeren in maatschappelijk kwetsbare situaties
  welkom te heten op onze vakantiekampen. We trachten onze kampen zo toegankelijk
  mogelijk te maken, door ze financieel, inhoudelijk en organisatorisch af te
  stemmen op hun specifieke noden en behoeften.
