title: Vrijwilliger worden?
text: >
  Onze vrijwilligers vormen het kloppende hart van AJOK en maken het mogelijk om onze
  kampen te organiseren en de kinderen en jongeren de tijd van hun leven te geven.
  Ervaring of een animatordiploma zijn niet vereist. Enthousiasme, een hart voor
  kinderen en een open blik vinden we des te belangrijker! Er zijn verschillende
  functies waarin je je als vrijwilliger kan inzetten tijdens onze kampen.

  Benieuwd welke functie jou op het lijf geschreven is? Zin en tijd om je handen uit
  de mouwen te steken en samen te werken met onze andere enthousiaste vrijwilligers?
  Lees hieronder dan zeker verder. Samen maken we het verschil!
