text: >
  Ben je overtuigd door een van de bovenstaande functies, ben je minimaal 18 jaar oud
  en kan je niet wachten om samen met ons en de kinderen op kamp te vertrekken? Schrijf
  je dan snel in via de onderstaande link en maak samen met ons het verschil!

  Ben je jonger dan 18 jaar en heb je toch interesse? Neem dan even contact met ons op
  via info@ajok.be.
