title: Onze kampen
text: >
  AJOK organiseert vakantiekampen voor kinderen en jongeren van 6 tot en met 18 jaar,
  die om verschillende redenen niet kunnen aansluiten bij het reguliere jeugdwerk. We
  bieden een herfstkamp, een paaskamp en 5 verschillende zomerkampen aan: voor elk wat
  wils! Wil je meer weten over onze verschillende kampen? Bekijk hieronder dan zeker
  ons aanbod!
