title: "AJOK staat voor: Alle Jongeren Op Kamp!"
text: >
  AJOK biedt kinderen en jongeren, die om financiële, gedragsmatige of andere
  problemen moeilijker kunnen aansluiten bij het regulier jeugdwerk, de mogelijkheid
  om toch een fantastische vakantie te beleven. Daar zetten wij, als team AJOK, ons
  dagelijks voor in.
