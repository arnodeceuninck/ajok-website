title: Gift & Belastingvermindering
text: "Je kan ons ook steunen door een gift te doen. Geef jouw gewenste bedrag en stort het op ons rekeningnummer.\n\nHeb je dit jaar 40 euro of meer aan AJOK gegeven? AJOK is erkend om fiscale attesten uit te reiken voor giften vanaf 40 euro, waarmee je recht hebt op een belastingvermindering van 45%. Daarvoor hebben we enkele gegevens van je nodig en moet je ons dus zeker even mailen met als onderwerp 'aanvraag fiscaal attest'."
