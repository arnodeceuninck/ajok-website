title: Onze Vrijwilligers
text: "Zonder vrijwilligers, geen AJOK! Wij draaien 100% op vrijwilligers en daar zijn we enorm trots op. Jaarlijks rekenen wij op zo'n 50 enthousiaste vrijwilligers die zich met hart en ziel inzetten voor onze kampen. Of het nu gaat om verpleging op kamp, helpen in de keuken of het animeren van de kinderen - we hebben altijd handen nodig. Zin om ook de handen uit de mouwen te steken? Kijk dan snel bij het tabje 'Word vrijwilliger'!"
