<div class="row align-items-stretch mb-0 d-flex flex-wrap equal-height-row" id="{{ include.id | default: include.title | strip }}">

    {% if include.img_mobile %}
    <div class="col-12 d-md-none w-100">
        <img src="{{ include.img_mobile }}" class="img-fluid section-img-mobile-fill" loading="lazy">
    </div>
    {% endif %}

    <div class="col-md-8 scroll-animation position-relative"> 
        <div class="row row-fit-height">
            <div class="section-content">

                <!-- This empty div adds extra padding on desktop -->
                <div class="d-none d-md-block section-spacer-sm"></div>

                <h2 class="text-uppercase font-italic black-line-below">{{ include.title }}</h2>
                <p>{{ include.text }}</p>
                {% if include.call_to_action %}
                <a href="{{ include.url }}" class="btn btn-success">{{ include.call_to_action }}</a>
                {% endif %}

                <!-- This empty div adds extra padding on desktop -->
                <div class="d-none d-md-block section-spacer-sm"></div>
                
            </div>
        </div>
        <div class="row mt-auto">
            <img id="hills" src="assets/images/artifacts/heuveltjes.webp" class="artifact-hills" loading="lazy" />
        </div>
    </div>

    <div class="col-md-4 d-none d-md-block scroll-animation section-img-panel {% if include.img_list %}slideshow-container{% endif %}">
        {% if include.img_list %}
            {% for item in include.img_list %}
                {% if item %}
                    <img src="{{ item }}" class="fade section-img-fill" loading="lazy">
                {% endif %}
            {% endfor %}
        {% else if include.img %}
             <img src="{{ include.img }}" class="section-img-fill" loading="lazy">
        {% endif %}
    </div>

    

</div>
